[env:wud]
platform = platformio/espressif32@6.12.0
board = esp32-s2-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -DUSBD_MODE=1
    -DUSBD_CDC=1
    -DUSBD_MSC=0
    -DUSBD_DFU=0
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit TinyUSB Library@^3.7.3

upload_speed = 921600

extra_scripts = pre:extra_script.py
