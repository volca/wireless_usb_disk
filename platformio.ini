[env:wud]
platform = platformio/espressif32@6.12.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    # Larger multipart/raw chunks for the upload handlers (default 1436).
    -DHTTP_UPLOAD_BUFLEN=8192
    -DHTTP_RAW_BUFLEN=8192

lib_deps =
    tzapu/WiFiManager@^2.0.17

upload_speed = 921600
board_build.filesystem = littlefs

; OTA upload over WiFi (ArduinoOTA / espota protocol). Only usable when the
; device has joined a station network: ArduinoOTA starts together with mDNS,
; so the device is reachable as wud.local (port 3232, password "wud").
[env:espota]
extends = env:wud
upload_protocol = espota
upload_port = wud.local
upload_flags =
    --port=3232
    --auth=wud
